<!DOCTYPE html>
<html lang="en-GB">

<head>

  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <link rel="stylesheet" href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.13.2/themes/base/jquery-ui.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
    }

    #date_filter {
      width: max-content;
      max-width: calc(100vw - 32px);
      position: relative;
      z-index: 1;
      margin: -24px auto 20px;
      text-align: center;
      align-self: center;
      display: grid;
      grid-template-columns: auto 90px auto 90px;
      align-items: center;
      gap: 8px 12px;
    }

    #date_filter input {
      width: 100%;
    }

    #range_error {
      grid-column: 1 / -1;
    }

  </style>


  <script type="text/javascript">


    // Load the Visualization API.
    google.charts.load('current', { 'packages': ['corechart'] });

    // Set a callback to run when the Google Visualization API is loaded.
    google.charts.setOnLoadCallback(drawChart);

    function drawChart() {
      // https://stackoverflow.com/questions/8808100/google-chart-background-color

      var chartWrap = new google.visualization.ChartWrapper({
        chartType: 'ComboChart',
        containerId: 'chart_div',
        options: {
          title: 'Water Temperature [°C] at The Wave',
          isStacked: true,
          seriesType: 'steppedArea',
          series: {
            0: { type: 'line', visibleInLegend: true },
            1: { color: '#0cf' },
            2: { color: '#39c' },
            3: { color: '#fc6' },
            4: { color: '#f63' },
            },
          width: 2000,
          height: 800,
          legend: 'right'
        }
      });

      var data = getData()

      var formatter = new google.visualization.DateFormat({pattern: 'd MMM HH:mm:ss'});
      formatter.format(data, 0);

      var fromInput = document.getElementById('from_date');
      var toInput = document.getElementById('to_date');
      var rangeError = document.getElementById('range_error');
      var rowCount = data.getNumberOfRows();

      if (rowCount === 0) {
        rangeError.textContent = 'No temperature data is available.';
        fromInput.disabled = true;
        toInput.disabled = true;
        chartWrap.setDataTable(data);
        chartWrap.draw();
        return;
      }

      var firstDate = data.getValue(0, 0);
      var lastDate = firstDate;
      for (var row = 1; row < rowCount; row++) {
        var timestamp = data.getValue(row, 0);
        if (timestamp < firstDate) {
          firstDate = timestamp;
        }
        if (timestamp > lastDate) {
          lastDate = timestamp;
        }
      }

      var earliestDate = new Date(firstDate);
      var latestDate = new Date(lastDate);
      var initialFromDate = new Date(lastDate);
      initialFromDate.setDate(initialFromDate.getDate() - 14);

      $(fromInput).datepicker({
        dateFormat: 'dd/mm/yy',
        minDate: earliestDate,
        maxDate: latestDate,
        onSelect: updateChart
      });
      $(toInput).datepicker({
        dateFormat: 'dd/mm/yy',
        minDate: earliestDate,
        maxDate: latestDate,
        onSelect: updateChart
      });
      fromInput.value = dateInputValue(initialFromDate < earliestDate ? earliestDate : initialFromDate);
      toInput.value = dateInputValue(latestDate);

      function updateChart() {
        var startDate = parseInputDate(fromInput.value);
        var endDate = parseInputDate(toInput.value);

        if (!startDate || !endDate || startDate > endDate) {
          rangeError.textContent = 'Choose a start date on or before the end date.';
          return;
        }

        rangeError.textContent = '';
        var endExclusive = new Date(endDate);
        endExclusive.setDate(endExclusive.getDate() + 1);
        var rows = [];

        for (var row = 0; row < data.getNumberOfRows(); row++) {
          var timestamp = data.getValue(row, 0);
          if (timestamp >= startDate && timestamp < endExclusive) {
            rows.push(row);
          }
        }

        var view = new google.visualization.DataView(data);
        view.setRows(rows);
        chartWrap.setDataTable(view);
        chartWrap.draw();
      }

      fromInput.addEventListener('change', updateChart);
      toInput.addEventListener('change', updateChart);
      updateChart();
    }

    function dateInputValue(date) {
      return String(date.getDate()).padStart(2, '0') + '/' +
        String(date.getMonth() + 1).padStart(2, '0') + '/' +
        date.getFullYear();
    }

    function parseInputDate(value) {
      var match = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(value);
      if (!match) {
        return null;
      }
      var day = Number(match[1]);
      var month = Number(match[2]) - 1;
      var year = Number(match[3]);
      var date = new Date(year, month, day);
      if (date.getFullYear() !== year || date.getMonth() !== month || date.getDate() !== day) {
        return null;
      }
      return date;
    }

    function getData() {
      var jsonData = $.ajax({
        url: "../temperature.json",
        dataType: "json",
        async: false
        // success: function (data) {
        //console.log(data);
        //}
      }).responseJSON;

      // var d = google.visualization.arrayToDataTable(

      var data = new google.visualization.DataTable();

      Object.entries(jsonData['temps']).forEach(function (jsonRowA, indexRow) {

        jsonRow = jsonRowA[1]

        // add columns
        if (indexRow === 0) {
          console.log(jsonRow)
          for (var column in jsonRow)
            // console.log(column)
            switch (column) {
              case 'timestamp': data.addColumn('date', column); break;
              case 'desc': break; //ignore
              case 'air': break;
              case 'water': data.addColumn('number', column); break;
            }
            data.addColumn('number', 'cold (0-10)')
            data.addColumn('number', 'tepid (10-15)')
            data.addColumn('number', 'warm (15-20)')
            data.addColumn('number', 'hot (20-30)')
        }


        // add row
        var dataRow = [];
        for (var column in jsonRow) {
          switch (column) {
            case 'timestamp': dataRow.push(new Date(jsonRow[column])); break;
            case 'desc': break; //ignore
            case 'air': break;
            case 'water': dataRow.push(parseFloat(jsonRow[column])); break;
          }
        }

        dataRow.push(10)
        dataRow.push(5)
        dataRow.push(5)
        dataRow.push(10)

        if (dataRow.length > 0) {
          data.addRow(dataRow);
        }
      });

      return data;

    }


  </script>


</head>

<body>
  <div id="chart_div"></div>
  <div id="date_filter">
    <label for="from_date">From</label>
    <input id="from_date" type="text" inputmode="numeric" placeholder="dd/mm/yyyy" autocomplete="off">
    <label for="to_date">To</label>
    <input id="to_date" type="text" inputmode="numeric" placeholder="dd/mm/yyyy" autocomplete="off">
    <span id="range_error" role="status" aria-live="polite"></span>
  </div>

  <!-- <div id="tempChart" style="width:100%; max-width:600px; height:500px;"></div> -->

</body>


</html>
